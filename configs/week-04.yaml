dataset:
  pairs: local-data/opencqa/week-03-pairs.jsonl
  development_count: 18
  validation_count: 6
  test_count: 6

optimizer:
  iterations: 2
  minibatch_size: 4
  pareto_size: 3
  patience: 2
  random_seed: 42

robustness:
  - variant_id: rotate-2
    transformation: rotate_2
    intended_behavior: invariance
  - variant_id: jpeg-60
    transformation: jpeg_60
    intended_behavior: invariance
  - variant_id: crop-right
    transformation: crop_right
    intended_behavior: graceful_degradation
  - variant_id: occlude-center
    transformation: occlude_center
    intended_behavior: graceful_degradation
